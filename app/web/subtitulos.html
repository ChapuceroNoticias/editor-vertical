<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtítulos en vivo</title>
<style>
  :root {
    --fondo: #0b0b0d; --panel: #15151a; --texto: #ececf1; --suave: #9a9aa6; --borde: #2a2a32;
    --acento: #d91e2b; --ok: #22c55e; --pend: #f59e0b; --rojo: #ff4553; --activo: #2a1215;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fondo); color: var(--texto); }
  .app { display: flex; gap: 12px; padding: 10px; height: 100%; }
  @media (max-width: 760px) { .app { flex-direction: column; height: auto; } }
  .izq { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pantalla { position: relative; background: #000; border-radius: 10px; overflow: hidden; line-height: 0; }
  video { display: block; height: min(680px, calc(100vh - 110px)); aspect-ratio: 9 / 16; background: #000; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #armado { display: none; pointer-events: auto; cursor: pointer; background: #000; }
  .controles { display: none; gap: 8px; align-items: center; width: 100%; max-width: 420px; }
  .controles input[type=range] { flex: 1; }
  .controles .tiempo { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--suave); min-width: 112px; text-align: right; }
  .modos { display: none; gap: 6px; }
  .modos button { border: 1px solid var(--borde); background: var(--panel); color: var(--texto); padding: 5px 10px;
    border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; }
  .modos button.activo { border-color: var(--acento); color: var(--acento); }
  .nota { max-width: 380px; font-size: 12.5px; color: var(--suave); text-align: center; }
  .nota.alerta { color: var(--pend); }
  .der { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: var(--panel);
    border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; }
  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border-bottom: 1px solid var(--borde); }
  .barra .ayuda { flex: 1 1 260px; color: var(--suave); font-size: 12.5px; }
  button.btn { border: 1px solid var(--borde); background: var(--panel); color: var(--texto); padding: 7px 12px;
    border-radius: 8px; cursor: pointer; font-weight: 600; }
  button.prim { background: var(--acento); color: #fff; border-color: var(--acento); }
  button:disabled { opacity: .5; cursor: default; }
  #estado { font-size: 13px; color: var(--suave); width: 100%; }
  #estado.ok { color: var(--ok); } #estado.pend { color: var(--pend); } #estado.err { color: var(--rojo); }
  .lista { overflow: auto; flex: 1 1 auto; }
  .fila { display: grid; grid-template-columns: 30px 86px 86px 1fr 118px 28px; gap: 6px; align-items: center;
    padding: 6px 10px; border-bottom: 1px solid var(--borde); }
  .fila.activa { background: var(--activo); }
  .fila.cambiada { box-shadow: inset 3px 0 0 var(--pend); }
  .fila input { width: 100%; padding: 6px 7px; border: 1px solid var(--borde); border-radius: 6px; background: var(--fondo);
    color: var(--texto); font: inherit; }
  .fila input.t { font-variant-numeric: tabular-nums; font-size: 13px; }
  .fila input.t.mal { border-color: #e5484d; color: #ff8a8d; background: rgba(229,72,77,.12); }
  .fila textarea.tx { width: 100%; padding: 6px 7px; border: 1px solid var(--borde); border-radius: 6px; background: var(--fondo);
    color: var(--texto); font: inherit; resize: none; overflow: hidden; line-height: 1.35; display: block; min-height: 32px; }
  .fila .ir, .fila .mas { border: 0; background: none; color: var(--suave); cursor: pointer; font-size: 15px; padding: 2px; }
  .fila .ir:hover, .fila .mas:hover { color: var(--acento); }
  .fila .alt { display: flex; gap: 3px; align-items: center; }
  .fila .alt button { border: 1px solid var(--borde); background: var(--panel); color: var(--texto); border-radius: 6px;
    cursor: pointer; font-size: 11px; padding: 5px 6px; line-height: 1; }
  .fila .alt button:hover { border-color: var(--acento); }
  .fila .alt input.dy { width: 52px; padding: 5px 4px; text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .fila .alt input.dy.movido { border-color: var(--pend); color: var(--pend); }
  /* sobre el subtítulo: cursor ↕ (también encima de la vista previa armada y del video, que traen su propio cursor) */
  .pantalla.sobre-sub, .pantalla.sobre-sub *, .pantalla.arrastrando, .pantalla.arrastrando * { cursor: ns-resize !important; }
  .encabezado { display: grid; grid-template-columns: 30px 86px 86px 1fr 118px 28px; gap: 6px; padding: 6px 10px;
    font-size: 12px; color: var(--suave); font-weight: 600; border-bottom: 1px solid var(--borde); }
</style>
<link rel="stylesheet" href="/app/grafito.css">
<style>
  /* ---------- Grafito: Subtítulos ---------- */
  .app { gap: 0; padding: 0; }
  .izq { padding: 18px 22px; border-right: 1px solid var(--linea); gap: 12px; }
  .pantalla { border-radius: 12px; }
  .controles .tiempo { font-family: var(--mono); color: var(--texto2); }
  .controles input[type=range] { accent-color: var(--texto); }
  .modos { background: var(--panel); border: 1px solid var(--borde); border-radius: 9px; padding: 3px; gap: 2px; }
  .modos button { border: 0; background: transparent; color: var(--suave); font-weight: 500; border-radius: 6px; }
  .modos button.activo { background: var(--borde); color: #fff; }
  .nota { color: var(--tenue); }
  .der { background: transparent; border: 0; border-radius: 0; }
  .barra { padding: 14px 20px; border-bottom: 1px solid var(--linea); gap: 10px; }
  .barra h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .barra .sp { flex: 1; }
  .chip { height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; display: inline-flex; align-items: center; }
  .chip.mal { background: rgba(229,37,42,.14); color: #FF8C8F; }
  .chip[hidden] { display: none; }
  .buscar { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--borde);
    background: var(--fondo); color: var(--tenue); width: 230px; }
  .buscar input { flex: 1; min-width: 0; border: 0 !important; background: transparent !important; padding: 0; color: var(--texto); font-size: 13px; outline: none; }
  button.btn { font-weight: 500; }
  .btn.prim { background: var(--texto); border-color: var(--texto); color: #0B0B0D; font-weight: 600; }
  .btn.prim:hover:not(:disabled) { background: #fff; border-color: #fff; }
  button:disabled { opacity: .35; }
  #estado { font-size: 12.5px; }
  .encabezado { padding: 10px 20px 6px; border-bottom: 0; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); }
  .lista { padding: 0 10px 10px; }
  .fila { position: relative; border-bottom: 0; border-radius: 8px; padding: 4px 10px; }
  .fila:hover { background: rgba(255,255,255,.025); }
  .fila.activa { background: var(--panel2); box-shadow: inset 0 0 0 1px var(--borde2); }
  .fila.cambiada { box-shadow: none; }
  .fila.cambiada.activa { box-shadow: inset 0 0 0 1px var(--borde2); }
  .fila.cambiada::after { content: ""; position: absolute; right: 4px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--pend); }
  .fila input, .fila textarea.tx { border-color: transparent; background: transparent; }
  .fila:hover input, .fila:hover textarea.tx, .fila.activa input, .fila.activa textarea.tx { border-color: var(--borde); background: var(--fondo); }
  .fila input:focus, .fila textarea.tx:focus { border-color: var(--borde2); background: var(--fondo); outline: none; }
  .fila input.t { font-family: var(--mono); color: var(--suave); }
  .fila.activa input.t { color: var(--texto); }
  .fila input.t.mal { border-color: #E5484D; color: #FF8A8D; background: rgba(229,72,77,.12); }
  .fila textarea.tx { font-size: 14px; }
  .fila .ir, .fila .mas { color: var(--tenue); }
  .fila .ir:hover, .fila .mas:hover { color: var(--texto); }
  .fila .alt button { background: transparent; border-color: transparent; color: var(--suave); }
  .fila .alt button:hover { border-color: var(--borde); color: var(--texto); }
  .fila .alt input.dy { font-family: var(--mono); color: var(--tenue); }
  .fila.oculta { display: none; }
  .titulo_solo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--linea); }
  .titulo_solo[hidden] { display: none; }
  .titulo_solo label { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); }
  .titulo_solo input { flex: 1 1 320px; height: 36px; padding: 0 12px; font-size: 14px; }
  .titulo_solo input.falta { border-color: #7A5A1E; }
  .titulo_solo .en_video { display: flex; align-items: center; gap: 6px; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--texto2); cursor: pointer; }
  .titulo_solo .en_video input { accent-color: var(--texto); width: 15px; height: 15px; }
  .aviso_titulo { flex-basis: 100%; font-size: 12.5px; color: var(--suave); }
  .aviso_titulo.falta { color: var(--pend); }
  .aviso_titulo.ok { color: var(--ok); }
  .pie { padding: 10px 20px; border-top: 1px solid var(--linea); display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 12px; color: var(--tenue); }
  .pie b { font-family: var(--mono); font-weight: 500; color: var(--suave); }
</style>

<body>
<div class="app">
  <div class="izq">
    <div class="pantalla" id="pantalla">
      <video id="video" controls playsinline preload="auto"></video>
      <canvas id="armado"></canvas>
      <canvas id="capa"></canvas>
    </div>
    <div class="controles" id="controles">
      <button class="btn" id="b_play">▶</button>
      <input type="range" id="barra_t" min="0" max="1" step="0.01" value="0">
      <span class="tiempo" id="t_vivo">00:00:00</span>
    </div>
    <div class="modos" id="modos">
      <button id="m_vivo" title="Se arma en vivo con tus correcciones actuales (sin renderizar)">Armado en vivo</button>
      <button id="m_render" title="El último video renderizado">Video renderizado</button>
    </div>
    <div class="nota" id="nota"></div>
  </div>
  <div class="der">
    <div class="titulo_solo" id="titulo_solo" hidden>
      <label for="titulo_txt">Título</label>
      <input type="text" id="titulo_txt" placeholder="Título del video (con él se nombra el archivo al exportar)">
      <label class="en_video" title="Pone la barra roja del título encima del clip (se ve aquí en vivo y sale en el video exportado)"><input type="checkbox" id="titulo_en_video"> Ponerlo en el video</label>
      <button class="btn" id="titulo_guardar" disabled>Guardar título</button>
      <span class="aviso_titulo" id="titulo_aviso"></span>
    </div>
    <div class="barra">
      <h2 id="cuenta">Subtítulos</h2>
      <span class="chip mal" id="chip_mal" hidden></span>
      <span class="sp"></span>
      <label class="buscar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
        <input type="search" id="buscar" placeholder="Buscar en los subtítulos" aria-label="Buscar en los subtítulos"></label>
      <button class="btn" id="descartar" disabled>Descartar</button>
      <button class="btn prim" id="guardar" disabled>Guardar subtítulos</button>
      <div id="estado"></div>
    </div>
    <div class="encabezado"><span></span><span>Inicio</span><span>Fin</span><span>Texto</span><span title="Sube (▲) o baja (▼) cada subtítulo por separado. También puedes arrastrarlo arriba o abajo sobre el video.">Altura ↕</span><span></span></div>
    <div class="lista" id="lista"></div>
    <div class="pie">
      <span><b>Enter</b> siguiente</span><span><b>Shift+Enter</b> cortar renglón</span><span><b>＋</b> agregar debajo</span>
      <span><b>▲▼</b> altura (Shift = 50 px) o arrastrándolo en el video</span><span><b>Alt+↑↓</b> mover el que se ve</span>
      <span>Texto vacío = quitar · tiempos en min:seg:centésimas del video editado</span>
    </div>
  </div>
</div>

<script>
const T = new URLSearchParams(location.search).get("t");
const $ = (id) => document.getElementById(id);
const video = $("video"), capa = $("capa"), ctx = capa.getContext("2d");
const arm = $("armado"), actx = arm.getContext("2d");
let vivo = false;      // true = se arma la vista previa en vivo desde el video original
let E = null;          // datos del armado (los mismos del editor de encuadre)
let tituloImg = null, franjaImg = null;
const imagenes = {};   // imágenes de los momentos ya cargadas
let D = null;          // datos del servidor
let filas = [];        // [{id, i, f, texto, palabras}]
let base = "";         // para saber si hay cambios
let cajaSub = null;    // dónde quedó dibujado el subtítulo que se ve (px del lienzo), para arrastrarlo
let arrastreSub = null;
let fuenteLista = false;

// ---------- tiempos ----------
function mmss(t) {
  const cc = Math.round(Math.max(0, t) * 100);
  const p = (n) => String(n).padStart(2, "0");
  return `${p(Math.floor(cc / 6000))}:${p(Math.floor(cc / 100) % 60)}:${p(cc % 100)}`;
}
function seg(v) {
  v = String(v || "").trim().replace(",", ".").replace(";", ":");
  if (!v) return null;
  const p = v.split(":");
  if (p.some(x => x !== "" && isNaN(Number(x)))) return null;
  if (p.length === 1) return Number(p[0]);
  if (p.length === 2) return Number(p[0] || 0) * 60 + Number(p[1] || 0);
  return Number(p[0] || 0) * 60 + Number(p[1] || 0) + Number((p[2] || "0").padEnd(2, "0").slice(0, 2)) / 100;
}
// fin con el que se muestra: nunca pasa del inicio del subtítulo que sigue (un fin mal escrito no hace
// que una línea vieja reaparezca más adelante)
function finEf(n) {
  const fl = filas[n], i = seg(fl.iTxt), f = seg(fl.fTxt);
  if (i === null || f === null) return null;
  for (let k = n + 1; k < filas.length; k++) {
    const j = seg(filas[k].iTxt);
    if (j !== null && j > i) return Math.min(f, j);
  }
  return f;
}
function tiempoMal(n, c) {
  const fl = filas[n], i = seg(fl.iTxt), f = seg(fl.fTxt);
  if (c === "iTxt") return i === null || (f !== null && i >= f) || (typeof E !== "undefined" && E && E.video && i > duracionEd() + 1);
  if (f === null || (i !== null && f <= i)) return true;
  for (let k = n + 1; k < filas.length; k++) {
    const j = seg(filas[k].iTxt);
    if (j !== null && i !== null && j > i) return f > j + 0.01;
  }
  return !!(typeof E !== "undefined" && E && E.video && f > duracionEd() + 1);
}
function marcarTiempos() {
  let malos = 0;
  document.querySelectorAll(".fila").forEach((el, n) => {
    if (!filas[n]) return;
    let m = false;
    el.querySelectorAll("input.t").forEach(inp => {
      const mal = tiempoMal(n, inp.dataset.c);
      inp.classList.toggle("mal", mal);
      inp.title = mal ? "Tiempo inválido: el fin no puede pasar del inicio del siguiente subtítulo (se corrige al guardar)" : "";
      m = m || mal;
    });
    if (m) malos++;
  });
  $("cuenta").textContent = `${filas.length} subtítulos`;
  $("chip_mal").hidden = !malos;
  $("chip_mal").textContent = malos === 1 ? "1 tiempo por revisar" : `${malos} tiempos por revisar`;
}
function filtrar() {
  const q = ($("buscar").value || "").trim().toLowerCase();
  document.querySelectorAll(".fila").forEach((el, n) => {
    el.classList.toggle("oculta", !!q && !(filas[n] && filas[n].texto.toLowerCase().includes(q)));
  });
}
function estado(txt, cls) { $("estado").textContent = txt; $("estado").className = cls || ""; }

// En vivo se reproduce el video ORIGINAL saltando las pausas recortadas; los subtítulos van en tiempo editado.
function aEditado(t) {
  let quitado = 0;
  for (const c of E.cortes) {
    if (t >= c.fin) quitado += c.fin - c.inicio;
    else if (t > c.inicio) { quitado += t - c.inicio; break; }
    else break;
  }
  return Math.max(0, t - quitado);
}
function aOriginal(te) {
  let t = te;
  for (const c of E.cortes) { if (t >= c.inicio - 1e-9) t += c.fin - c.inicio; else break; }
  return t;
}
let fuenteProxy = null;   // en vivo: copia ligera sin pausas (su tiempo ya es el del video editado)
function ahora() { return vivo && !fuenteProxy ? aEditado(video.currentTime) : video.currentTime; }
function irA(te) { video.currentTime = vivo && !fuenteProxy ? Math.min(E.video.duracion, aOriginal(te) + 0.001) : te; }
const tO = () => fuenteProxy ? aOriginal(video.currentTime) : video.currentTime;   // tiempo del video original

// ---------- palabras con tiempo para la vista previa ----------
function palabrasDe(fila) {
  // renglones que puso el usuario con Shift+Enter: la última palabra de cada renglón lleva salto
  const ws = [], saltos = new Set();
  for (const ln of fila.texto.replace(/\r/g, "").split("\n")) {
    const p = ln.trim().split(/\s+/).filter(Boolean);
    if (!p.length) continue;
    if (ws.length) saltos.add(ws.length - 1);
    ws.push(...p);
  }
  const conSalto = (arr) => arr.map((w, k) => ({ ...w, salto: saltos.has(k) }));
  return conSalto(palabrasBase(fila, ws));
}
function palabrasBase(fila, ws) {
  const i = seg(fila.iTxt), f = seg(fila.fTxt);
  if (!ws.length || i === null || f === null || f <= i) return [];
  const orig = fila.palabras || [];
  if (orig.length === ws.length && orig.length && fila.i0 !== undefined && fila.f0 > fila.i0) {
    const esc = (f - i) / (fila.f0 - fila.i0);
    return ws.map((p, k) => ({ p, i: i + (orig[k].i - fila.i0) * esc, f: i + (orig[k].f - fila.i0) * esc }));
  }
  const paso = (f - i) / ws.length;
  return ws.map((p, k) => ({ p, i: i + k * paso, f: i + (k + 1) * paso }));
}

// ---------- dibujo de los subtítulos (igual que el render) ----------
function disenoEn(t) {
  if (vivo) return disenoVivo();
  let lay = D.diseno.length ? D.diseno[0][1] : "persona";
  for (const [te, l] of D.diseno) { if (te <= t + 1e-6) lay = l; else break; }
  return lay;
}
function hex(c) { return c || "#ffffff"; }

function ajustarCanvas() {
  const r = video.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  capa.width = Math.round(r.width * dpr); capa.height = Math.round(r.height * dpr);
}

// ---------- stickers (se ponen en Edición; aquí solo se ven) ----------
const stHojas = {};
let stTmpA = null, stTmpB = null, stCapa = null, stTitulo = null;
const propDe = (s) => Math.round(Math.max(0.1, Math.min(10, s.prop || 1)) * 100) / 100;
function hojaSticker(tipo, prop) {
  const clave = tipo + "@" + prop.toFixed(2);
  if (!stHojas[clave]) { stHojas[clave] = new Image(); stHojas[clave].src = `/stk/hoja?tipo=${tipo}&prop=${prop.toFixed(2)}&t=${encodeURIComponent(T)}`; }
  const im = stHojas[clave];
  return im.complete && im.naturalWidth ? im : null;
}
function cuadroTenido(tipo, color, k, prop) {
  const im = hojaSticker(tipo, prop), m = D.meta_stickers, C = m.COLS;
  if (!im) return null;
  const fw = Math.floor(im.naturalWidth / (2 * C)), fh = Math.floor(im.naturalHeight / Math.ceil(m.F / C));
  if (!stTmpA) { stTmpA = document.createElement("canvas"); stTmpB = document.createElement("canvas"); }
  if (stTmpA.width !== fw || stTmpA.height !== fh) { stTmpA.width = stTmpB.width = fw; stTmpA.height = stTmpB.height = fh; }
  const a = stTmpA.getContext("2d"), b = stTmpB.getContext("2d");
  const fx = (k % C) * fw, fy = Math.floor(k / C) * fh;
  b.clearRect(0, 0, fw, fh);
  b.drawImage(im, C * fw + fx, fy, fw, fh, 0, 0, fw, fh);
  b.globalCompositeOperation = "multiply"; b.fillStyle = color; b.fillRect(0, 0, fw, fh);
  b.globalCompositeOperation = "destination-in"; b.drawImage(im, C * fw + fx, fy, fw, fh, 0, 0, fw, fh);
  b.globalCompositeOperation = "source-over";
  a.clearRect(0, 0, fw, fh); a.drawImage(im, fx, fy, fw, fh, 0, 0, fw, fh); a.drawImage(stTmpB, 0, 0);
  return stTmpA;
}
// se dibujan en una capa aparte y se les quita lo que tapa la franja azul y el título (van debajo de ellos)
function dibujarStickers(cx, t, W, H) {
  const m = D && D.meta_stickers;
  if (!m) return;
  const activos = (D.stickers || []).filter(s => s.i <= t && t < s.f);
  if (!activos.length) return;
  if (!stCapa) stCapa = document.createElement("canvas");
  if (stCapa.width !== W || stCapa.height !== H) { stCapa.width = W; stCapa.height = H; }
  const g = stCapa.getContext("2d");
  g.clearRect(0, 0, W, H);

    if (!r.ok) return false;
    const d = await r.json();
    if (!d.soportado) return false;
    E = d;
  } catch (err) { return false; }
  if (E.titulo) { tituloImg = new Image(); tituloImg.src = `/enc/titulo?t=${encodeURIComponent(T)}&v=${Date.now()}`; }
  if (E.armado.dividida.franja_fondo) { franjaImg = new Image(); franjaImg.src = `/enc/franja?t=${encodeURIComponent(T)}`; }
  $("barra_t").max = duracionEd();
  return true;
}
function ponerModo(enVivo) {
  const te = video.src ? ahora() : 0;
  vivo = enVivo;
  video.pause();
  arm.style.display = vivo ? "block" : "none";
  $("controles").style.display = vivo ? "flex" : "none";
  video.controls = !vivo;
  $("m_vivo").classList.toggle("activo", vivo);
  $("m_render").classList.toggle("activo", !vivo);
  fuenteProxy = vivo && E && E.proxy ? E.proxy : null;
  video.src = !vivo ? `/sub/video?t=${encodeURIComponent(T)}&v=${Date.now()}`
    : (fuenteProxy ? `/enc/proxy?t=${encodeURIComponent(T)}&f=${fuenteProxy.firma}` : `/enc/video?t=${encodeURIComponent(T)}`);
  if (vivo && !fuenteProxy && E && E.preparando) setTimeout(vigilarProxy, 5000);
  video.addEventListener("loadedmetadata", () => { irA(te); ajustarArmado(); }, { once: true });
  if (vivo) {
    $("nota").textContent = "Armado en vivo con tus correcciones actuales (encuadre, pantalla, imágenes, pausas). " +
      "Es una vista aproximada: no salen las cortinillas. El video final se arma en «Exportar».";
    $("nota").className = "nota";
  } else {
    $("nota").textContent = D.desactualizada
      ? "Este es el último render; tiene cambios que todavía no están renderizados."
      : "Vista previa: los subtítulos que ves aquí son los de la lista, con tus cambios.";
    $("nota").className = D.desactualizada ? "nota alerta" : "nota";
  }
}
async function vigilarProxy() {   // cuando la copia ligera está lista, se cambia sola (sin perder el punto)
  if (!E || !vivo || fuenteProxy) return;
  try {
    const d = await (await fetch(`/enc/proxy_estado?t=${encodeURIComponent(T)}`)).json();
    E.proxy = d.proxy; E.preparando = d.preparando;
    if (d.proxy) { const seguia = !video.paused; ponerModo(true); if (seguia) video.addEventListener("loadedmetadata", () => video.play(), { once: true }); return; }
  } catch (err) {}
  if (E.preparando) setTimeout(vigilarProxy, 5000);
}
arm.addEventListener("click", () => video.paused ? video.play() : video.pause());
$("b_play").onclick = () => video.paused ? video.play() : video.pause();
$("barra_t").addEventListener("input", () => { arrastrando = true; irA(Number($("barra_t").value)); });
$("barra_t").addEventListener("change", () => { arrastrando = false; });
$("m_vivo").onclick = () => { if (!vivo) ponerModo(true); };
$("buscar").addEventListener("input", filtrar);
$("titulo_txt").addEventListener("input", () => pintarTitulo());
$("titulo_txt").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); if (!$("titulo_guardar").disabled) guardarTitulo(); } });
$("titulo_guardar").onclick = guardarTitulo;
$("titulo_en_video").addEventListener("change", () => pintarTitulo());
$("m_render").onclick = () => { if (vivo) ponerModo(false); };
new ResizeObserver(ajustarArmado).observe(video);
let pestanaOculta = false;
new ResizeObserver(async () => {
  if (document.documentElement.clientWidth === 0) { pestanaOculta = true; return; }
  if (!pestanaOculta) return;
  pestanaOculta = false;
  if (await revisarCambiosEdicion()) return;
  if (!E) return;
  const te = ahora(), antes = fuenteProxy && fuenteProxy.firma;
  E = null;
  await cargarArmado();
  if (vivo && (E.proxy ? E.proxy.firma : null) !== antes) { ponerModo(true); return; }   // cambiaron las pausas
  if (vivo) irA(te);
}).observe(document.documentElement);

// ¿se renderizó de nuevo o se quitó / restauró un tramo en Edición? Entonces los tiempos de los subtítulos
// se recalculan (se recarga si aquí no hay cambios sin guardar). true = se recargó.
let avisoEdicion = false;
async function revisarCambiosEdicion() {
  try {
    const d = await (await fetch(`/sub/datos?t=${encodeURIComponent(T)}`)).json();
    if (D && (d.previa_v !== D.previa_v || d.firma_cortes !== D.firma_cortes)) {
      if (!hayCambios()) { location.reload(); return true; }
      if (!avisoEdicion) {
        avisoEdicion = true;
        $("nota").textContent = "Cambió la edición (render nuevo o tramos quitados): guarda tus cambios y se acomodan los tiempos nuevos.";
        $("nota").className = "nota alerta";
      }
    }
  } catch (err) { /* sin conexión: se revisa la próxima vez */ }
  return false;
}
// también mientras la pestaña está abierta (por si el render termina estando aquí)
setInterval(() => { if (T && D && !document.hidden && document.documentElement.clientWidth > 0) revisarCambiosEdicion(); }, 6000);

// ---------- lista ----------
function firma() { return JSON.stringify(filas.map(f => [f.iTxt, f.fTxt, f.texto, f.dy || 0])); }
function moverFila(fl, d) {   // sube (−) o baja (+) SOLO este subtítulo
  fl.dy = Math.max(-1800, Math.min(1800, Math.round((fl.dy || 0) + d)));
  const n = filas.indexOf(fl), el = document.querySelectorAll(".fila")[n];
  if (el) {
    const inp = el.querySelector("input.dy");
    inp.value = fl.dy; inp.classList.toggle("movido", !!fl.dy);
    el.classList.add("cambiada");
  }
  actualizarBotones();
}
function hayCambios() { return firma() !== base; }
function actualizarBotones() {
  const c = hayCambios();
  $("guardar").disabled = !c; $("descartar").disabled = !c;
  if (c) estado("Cambios sin guardar (ya se ven en el video).", "pend");
}

let ultimaActiva = -1;
function marcarActiva() {
  const t = ahora();
  let k = -1;
  filas.forEach((fl, n) => { const i = seg(fl.iTxt), f = finEf(n); if (i !== null && f !== null && i <= t && t < f) k = n; });
  if (k === ultimaActiva) return;
  ultimaActiva = k;
  document.querySelectorAll(".fila").forEach((el, n) => el.classList.toggle("activa", n === k));
  const editando = document.activeElement && document.activeElement.closest && document.activeElement.closest(".lista");
  if (k >= 0 && !video.paused && !editando) {
    const el = document.querySelectorAll(".fila")[k];
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

function pintarLista() {
  const lista = $("lista");
  lista.innerHTML = "";
  filas.forEach((fl, n) => {
    const div = document.createElement("div");
    div.className = "fila";
    div.innerHTML = `<button class="ir" title="Ir a este subtítulo">▶</button>
      <input class="t" data-c="iTxt" value="${fl.iTxt}"><input class="t" data-c="fTxt" value="${fl.fTxt}">
      <textarea class="tx" data-c="texto" rows="1" title="Shift+Enter = cortar el renglón aquí"></textarea>
      <span class="alt"><button data-d="-10" title="Subir este subtítulo (Shift: 50 px)">▲</button><input class="dy" type="number" step="5" title="px: negativo = más arriba, 0 = donde lo pone la plataforma"><button data-d="10" title="Bajar este subtítulo (Shift: 50 px)">▼</button></span><button class="mas" title="Agregar un subtítulo debajo">＋</button>`;
    const tx = div.querySelector('[data-c="texto"]');
    tx.value = fl.texto;
    const crecer = () => { tx.style.height = "auto"; tx.style.height = tx.scrollHeight + 2 + "px"; };
    tx.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {   // Enter solo: pasa al siguiente subtítulo; Shift+Enter: salto de línea
        e.preventDefault();
        const todos = document.querySelectorAll('.fila [data-c="texto"]');
        if (todos[n + 1]) todos[n + 1].focus();
      }
    });
    tx.addEventListener("input", crecer);
    requestAnimationFrame(crecer);
    div.querySelector(".ir").onclick = () => { const i = seg(fl.iTxt); if (i !== null) { irA(i + 0.01); } };
    const inDy = div.querySelector("input.dy");
    inDy.value = fl.dy || 0; inDy.classList.toggle("movido", !!fl.dy);
    div.querySelectorAll(".alt button").forEach(b => b.onclick = (e) => {
      moverFila(fl, Number(b.dataset.d) * (e.shiftKey ? 5 : 1));
      const i = seg(fl.iTxt); if (i !== null && video.paused) irA(i + 0.01);
    });
    inDy.onchange = () => { const v = Number(inDy.value); moverFila(fl, (isFinite(v) ? v : 0) - (fl.dy || 0)); };
    inDy.onfocus = () => { const i = seg(fl.iTxt); if (i !== null && video.paused) irA(i + 0.01); };
    div.querySelectorAll("input.t, textarea").forEach(inp => {
      inp.oninput = () => {
        fl[inp.dataset.c] = inp.value;
        div.classList.toggle("cambiada", true);
        if (inp.classList.contains("t")) marcarTiempos();
        actualizarBotones();
      };
      inp.onfocus = () => { const i = seg(fl.iTxt); if (i !== null && video.paused) irA(i + 0.01); };
    });
    div.querySelector(".mas").onclick = () => {
      const f = seg(fl.fTxt) || 0;
      const sig = filas[n + 1] ? seg(filas[n + 1].iTxt) : f + 1.5;
      filas.splice(n + 1, 0, { id: -1, iTxt: mmss(f), fTxt: mmss(Math.max(f + 0.5, Math.min(sig, f + 2))), texto: "", palabras: [], dy: fl.dy || 0 });
      pintarLista(); actualizarBotones();
      document.querySelectorAll('.fila [data-c="texto"]')[n + 1].focus();
    };
    lista.appendChild(div);
  });
  marcarTiempos();
  filtrar();
  ultimaActiva = -2;
}

let tituloGuardado = "", enVideoGuardado = false;
let tituloSoloImg = null;   // la barra del título encima del clip (la arma el servidor igual que en el export)
function cargarTituloImg() {
  tituloSoloImg = null;
  if (!D || !D.solo || !enVideoGuardado || !tituloGuardado) return;
  const im = new Image();
  im.onload = () => { tituloSoloImg = im; };
  im.src = `/enc/titulo?t=${encodeURIComponent(T)}&v=${Date.now()}`;
}
function pintarTitulo(msg) {
  const caja = $("titulo_solo");
  caja.hidden = !D.solo;
  if (!D.solo) return;
  const txt = $("titulo_txt").value.trim(), falta = !tituloGuardado;
  $("titulo_guardar").disabled = txt === tituloGuardado && $("titulo_en_video").checked === enVideoGuardado;
  $("titulo_txt").classList.toggle("falta", falta && !txt);
  const av = $("titulo_aviso");
  if (msg) { av.textContent = msg; av.className = "aviso_titulo ok"; return; }
  av.className = "aviso_titulo" + (falta ? " falta" : "");
  av.textContent = falta ? `⚠ Este video no tiene título: al exportar se llamará «${D.nombre_sin_titulo}». Escríbelo y dale Guardar título.`
    : (!$("titulo_guardar").disabled ? "Cambios sin guardar en el título." :
       (enVideoGuardado ? "El título se ve encima del clip y saldrá así en el video exportado." : "El título solo da nombre al archivo (no se pone encima del clip)."));
}
async function guardarTitulo() {
  const titulo = $("titulo_txt").value.trim(), en_video = $("titulo_en_video").checked;
  try {
    const r = await fetch("/edi/titulo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: T, titulo, en_video }) });
    if (!r.ok) throw new Error(await r.text());
    tituloGuardado = titulo; enVideoGuardado = en_video;
    cargarTituloImg();
    pintarTitulo(titulo ? "Título guardado ✓ " + (en_video ? "Se ve encima del clip y saldrá así al exportar." : "El video se exportará con este nombre.") : "");
  } catch (err) { $("titulo_aviso").textContent = "No se pudo guardar el título: " + err.message; $("titulo_aviso").className = "aviso_titulo falta"; }
}
function desdeDatos(d) {
  D = d;
  if (D.solo && document.activeElement !== $("titulo_txt")) {
    tituloGuardado = (D.titulo_texto || "").trim();
    $("titulo_txt").value = tituloGuardado;
    enVideoGuardado = !!D.titulo_en_video;
    $("titulo_en_video").checked = D.titulo_en_video == null ? true : enVideoGuardado;   // si nunca se eligió, se propone ponerlo
    cargarTituloImg();
  }
  pintarTitulo();
  filas = d.grupos.map((g, n) => ({ id: g.id ?? n, iTxt: mmss(g.i), fTxt: mmss(g.f), texto: g.texto, palabras: g.palabras, i0: g.i, f0: g.f, dy: g.dy || 0 }));
  base = firma();
  pintarLista();
  actualizarBotones();
}

async function cargar() {
  const r = await fetch(`/sub/datos?t=${encodeURIComponent(T)}`);
  desdeDatos(await r.json());
  // el cuadro toma la forma del video real (en «Solo subtítulos» el clip puede ser horizontal)
  const [vw, vh] = D.salida || [1080, 1920];
  if (vw && vh) {
    video.style.aspectRatio = `${vw} / ${vh}`;
    if (vw > vh) { video.style.height = "auto"; video.style.width = "min(560px, 42vw)"; }
    ajustarCanvas();
  }
  const hayArmado = await cargarArmado();
  const hayRender = D.hay_video && D.limpia && !D.provisional;
  if (hayArmado && hayRender) $("modos").style.display = "flex";
  if (hayArmado && (!hayRender || D.desactualizada)) ponerModo(true);
  else if (hayRender || D.hay_video) {
    ponerModo(false);
    if (!D.limpia) {
      $("nota").textContent = "Este video se exportó con una versión anterior: exporta de nuevo una vez " +
        "para ver aquí los cambios de subtítulos en vivo.";
      $("nota").className = "nota alerta";
    }
  } else {
    $("nota").textContent = "Aún no hay video renderizado.";
    $("nota").className = "nota alerta";
  }
  try {
    const f = new FontFace("SubFuente", `url(/sub/fuente?t=${encodeURIComponent(T)})`);
    await f.load(); document.fonts.add(f); fuenteLista = true;
  } catch (e) { fuenteLista = true; }
}

$("guardar").onclick = async () => {
  $("guardar").disabled = true;
  estado("Guardando…");
  try {
    const cuerpo = { t: T, cortes: D.cortes, filas: filas.map(fl => ({ i: fl.iTxt, f: fl.fTxt, texto: fl.texto, id: fl.id, dy: fl.dy || 0 })) };
    const r = await fetch("/sub/guardar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    desdeDatos(Object.assign(D, d.datos));
    if (avisoEdicion) { location.reload(); return; }   // se guardó con los tiempos de antes: ahora se ve lo nuevo
    estado(`Guardado ✓ (${d.n} subtítulos). Se ven en la vista previa; el video final se arma en «Exportar».`, "ok");
  } catch (e) {
    estado("No se pudo guardar: " + e.message, "err");
    actualizarBotones();
  }
};
$("descartar").onclick = () => { desdeDatos(D); estado(""); };
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (!$("guardar").disabled) $("guardar").click(); }
  if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown") && D) {   // mueve el subtítulo que se ve ahora
    e.preventDefault();
    if (cajaSub) moverFila(cajaSub.fila, (e.key === "ArrowUp" ? -10 : 10) * (e.shiftKey ? 5 : 1));
  }
});

// ---------- arrastrar el subtítulo que se ve, arriba o abajo, sobre el video ----------
function puntoLienzo(e) {
  const r = capa.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  return [(e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr];
}
let encimaSub = false;   // el mouse está sobre el subtítulo que se ve (para marcarlo)
// recuadro punteado alrededor del subtítulo cuando el mouse está encima o se está arrastrando
function marcoArrastre() {
  if (!cajaSub || !(encimaSub || arrastreSub)) return;
  const dpr = window.devicePixelRatio || 1, m = 8 * dpr;
  ctx.save();
  ctx.setLineDash([8 * dpr, 6 * dpr]); ctx.lineWidth = 2 * dpr; ctx.strokeStyle = "#fbbf24";
  ctx.strokeRect(cajaSub.x0 - m, cajaSub.y0 - m, cajaSub.x1 - cajaSub.x0 + 2 * m, cajaSub.y1 - cajaSub.y0 + 2 * m);
  const dy = Math.round(cajaSub.fila.dy || 0);
  const txt = `↕ arrastra para subir o bajar · ${dy > 0 ? "+" : ""}${dy}`;
  ctx.setLineDash([]); ctx.font = `${12 * dpr}px sans-serif`; ctx.textBaseline = "bottom";
  const w = ctx.measureText(txt).width + 12 * dpr, y = Math.max(18 * dpr, cajaSub.y0 - m - 4 * dpr);
  ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(cajaSub.x0 - m, y - 18 * dpr, w, 18 * dpr);
  ctx.fillStyle = "#fbbf24"; ctx.fillText(txt, cajaSub.x0 - m + 6 * dpr, y - 3 * dpr);
  ctx.restore();
}
function sobreSub(e) {
  if (!cajaSub) return false;
  const [x, y] = puntoLienzo(e), m = 22 * (window.devicePixelRatio || 1);
  return x >= cajaSub.x0 - m && x <= cajaSub.x1 + m && y >= cajaSub.y0 - m && y <= cajaSub.y1 + m;
}
let recienArrastrado = false;
const pant = $("pantalla");
pant.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || !sobreSub(e)) return;
  e.preventDefault(); e.stopPropagation();
  const s = capa.width / D.salida[0], k = s * ((D.salida[1] || 1920) / 1920);   // px del lienzo por unidad de altura
  arrastreSub = { fila: cajaSub.fila, y: e.clientY, dy0: cajaSub.fila.dy || 0, k };
  pant.classList.add("arrastrando");
  video.pause();
}, true);
window.addEventListener("pointermove", (e) => {
  if (arrastreSub) {
    const dpr = window.devicePixelRatio || 1;
    const nuevo = Math.round(arrastreSub.dy0 + (e.clientY - arrastreSub.y) * dpr / arrastreSub.k);
    if (nuevo !== (arrastreSub.fila.dy || 0)) { moverFila(arrastreSub.fila, nuevo - (arrastreSub.fila.dy || 0)); recienArrastrado = true; }
    return;
  }
  const r = pant.getBoundingClientRect();
  const dentro = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  encimaSub = dentro && sobreSub(e);
  pant.classList.toggle("sobre-sub", encimaSub);
});
window.addEventListener("pointerup", () => {
  if (!arrastreSub) return;
  arrastreSub = null; pant.classList.remove("arrastrando");
  setTimeout(() => { recienArrastrado = false; }, 300);
});
pant.addEventListener("click", (e) => { if (recienArrastrado) { e.preventDefault(); e.stopPropagation(); } }, true);

new ResizeObserver(ajustarCanvas).observe(video);
video.addEventListener("loadedmetadata", ajustarCanvas);
if (T) { cargar(); requestAnimationFrame(bucle); }
else $("lista").innerHTML = '<div style="padding:30px;color:var(--suave)">Carga un video primero.</div>';
</script>
</body>
